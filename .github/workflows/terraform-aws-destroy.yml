# Generate Infra → Destroy Resources.
# Dispatched from main with input terraform_ref = latest deployed generate-infra-* branch.
# Checks out that feature branch and terraform destroy using the same S3 state as deploy.
name: Terraform AWS Destroy

on:
  workflow_dispatch:
    inputs:
      terraform_ref:
        description: Feature branch whose generated Terraform should be destroyed
        required: true
        type: string
      confirm_destroy:
        description: Set true only after reviewing the destroy plan. false runs plan only and does not delete.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-deploy-${{ github.repository }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || format('{0}/terraform.tfstate', github.repository) }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TERRAFORM_REF: ${{ inputs.terraform_ref }}

jobs:
  discover:
    name: Discover Terraform configurations
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.terraform.outputs.directories }}
      found: ${{ steps.terraform.outputs.found }}
    steps:
      - name: Check out generated feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.terraform_ref }}

      - name: Show destroy ref
        run: |
          echo "terraform_ref=${{ inputs.terraform_ref }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"

      - name: Find Terraform directories
        id: terraform
        shell: bash
        run: |
          if ls ./*.tf >/dev/null 2>&1; then
            directories='["."]'
          else
            directories=$(find . -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path './.git/*' \
              -printf '%h\n' |
              sed 's|^\./||' |
              sort -u |
              jq -R -s -c 'split("\n") | map(select(length > 0)) | map(if . == "" then "." else . end)')
          fi

          echo "directories=$directories" >> "$GITHUB_OUTPUT"

          if [ "$directories" = "[]" ] || [ -z "$directories" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  destroy:
    name: Terraform destroy - ${{ matrix.directory }}
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out generated feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.terraform_ref }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-github-actions-destroy
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure S3 backend
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            echo "Using backend.tf from branch ${TERRAFORM_REF}."
            exit 0
          fi
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Set Terraform State S3 Bucket in the agent Settings or GitHub variable TF_STATE_BUCKET."
            exit 1
          fi
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {}' \
            '}' > backend.tf
          echo "Wrote partial backend.tf; init will pass bucket/key/region."

      - name: Terraform init
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            terraform init -input=false -no-color -reconfigure
          elif [ -n "${TF_STATE_BUCKET}" ]; then
            terraform init -input=false -no-color -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" \
              -backend-config="encrypt=true"
          else
            echo "::error::No S3 backend configured."
            exit 1
          fi

      - name: Terraform plan destroy
        run: terraform plan -destroy -input=false -no-color

      - name: Terraform destroy
        if: ${{ inputs.confirm_destroy == true || inputs.confirm_destroy == 'true' }}
        run: terraform destroy -input=false -no-color -auto-approve

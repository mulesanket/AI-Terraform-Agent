services:
  agent:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - SERVER_HOST=0.0.0.0
    volumes:
      - ./workspace:/app/workspace
      - agent-data:/app/data
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "scheduler.py"]
    env_file: .env
    volumes:
      - ./workspace:/app/workspace
      - agent-data:/app/data
    restart: unless-stopped

volumes:
  agent-data:
